name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Generate code
        run: make generate

      - name: check for diff to generated code
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Uncommitted changes found. Please run 'make generate' and commit the changes."
            git status
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
